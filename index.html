<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DVD Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#f6f7f9;color:#111}
.card{max-width:600px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}
h1{font-size:24px}p{line-height:1.4;color:#555}
button{font-size:18px;padding:14px 18px;border:0;border-radius:12px;background:#1a73e8;color:#fff;margin:6px 0;width:100%}
button.stop{background:#555}input{font-size:18px;padding:12px;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #bbb;margin:8px 0}
#reader{width:100%;margin:15px 0;border-radius:14px;overflow:hidden;background:#111;min-height:20px}
#status{padding:12px;background:#f1f3f4;border-radius:12px;min-height:24px}
.small{font-size:13px;color:#777}
</style>
</head>
<body><div class="card">
<h1>🎬 DVD Scanner</h1>
<p>Scan the barcode on the back of a DVD. The barcode will be sent to your Google Sheet queue.</p>
<div id="reader"></div>
<button id="start">Start Camera</button>
<button id="stop" class="stop" style="display:none">Stop Camera</button>
<input id="manual" inputmode="numeric" autocomplete="off" placeholder="Or type barcode manually">
<button id="add">Add Barcode</button>
<div id="status">Ready.</div>
<p class="small">Tip: Allow camera access when Safari asks. Keep the barcode flat and well lit.</p>
</div>
<script>
const ENDPOINT='PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
let scanner=null,running=false,lastCode='',lastAt=0;
const status=m=>document.getElementById('status').textContent=m;
function submitBarcode(code){
 code=String(code||'').trim(); if(!/^\d{8,14}$/.test(code)){status('Please enter a valid 8–14 digit barcode.');return;}
 const now=Date.now(); if(code===lastCode&&now-lastAt<2500)return; lastCode=code;lastAt=now;
 status('Sending '+code+'…');
 const f=document.createElement('form');f.method='POST';f.action=ENDPOINT;f.target='submitFrame';
 const i=document.createElement('input');i.type='hidden';i.name='barcode';i.value=code;f.appendChild(i);document.body.appendChild(f);f.submit();f.remove();
 document.getElementById('manual').value='';
 status('✓ Barcode '+code+' sent to your queue.');
}
async function start(){
 if(ENDPOINT.includes('PASTE_')){status('Scanner is not configured yet. Put your Apps Script /exec URL in this page.');return;}
 if(typeof Html5Qrcode==='undefined'){status('Scanner library did not load. Check your internet connection and reload.');return;}
 try{
  scanner=new Html5Qrcode('reader',{verbose:false});
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E]},txt=>submitBarcode(txt),()=>{});
  running=true;document.getElementById('start').style.display='none';document.getElementById('stop').style.display='block';status('Camera running — scan a DVD barcode.');
 }catch(e){status('Camera error: '+(e.message||e));}
}
async function stop(){if(scanner&&running){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}running=false;}document.getElementById('start').style.display='block';document.getElementById('stop').style.display='none';status('Camera stopped.');}
document.getElementById('start').onclick=start;document.getElementById('stop').onclick=stop;document.getElementById('add').onclick=()=>submitBarcode(document.getElementById('manual').value);
</script>
<iframe name="submitFrame" style="display:none"></iframe>
</body></html>
